backend:
  name: git-gateway
  branch: main

locale: 'es'

media_folder: "src/assets/productos"
public_folder: "../../assets/productos"

collections:
  - name: "categorias"
    label: "Categorías"
    folder: "src/content/categorias"
    create: true
    slug: "{{slug}}"
    identifier_field: "nombre"
    fields:
      - {label: "Nombre", name: "nombre", widget: "string"}
      - label: "Imagen de Categoría"
        name: "imagen"
        widget: "object"
        fields:
          - {label: "Imagen", name: "imagen", widget: "image"}
          - {label: "Texto Alternativo", name: "alt", widget: "string"}
  - name: "productos"
    label: "Productos"
    folder: "src/content/productos"
    create: true
    slug: "{{slug}}"
    identifier_field: "nombre"
    fields:
      - {label: "Nombre", name: "nombre", widget: "string", hint: "Nombre público del producto"}
      - label: "Categoría"
        name: "categoria"
        widget: "relation"
        collection: "categorias"
        search_fields: ["nombre"]
        value_field: "{{slug}}"
        display_fields: ["nombre"]
        hint: "Selecciona la categoría a la que pertenece"
      - label: "Imágenes"
        name: "imagenes"
        widget: "list"
        summary: '{{fields.imagen}} - {{fields.alt}}'
        hint: "Sube las fotos del producto. La primera imagen será la principal mostrada en el catálogo."
        fields:
          - {label: "Imagen", name: "imagen", widget: "image"}
          - {label: "Texto Alternativo", name: "alt", widget: "string", hint: "Describe la imagen para accesibilidad y SEO"}
      - {label: "Descripción Corta", name: "descripcion_corta", widget: "text", hint: "Resumen breve que aparece en la tarjeta del catálogo"}
      - {label: "Descripción Larga", name: "descripcion_larga", widget: "text", hint: "Descripción detallada del producto."}
      - label: "Medidas"
        name: "medidas"
        widget: "object"
        hint: "Dimensiones de referencia del mueble."
        fields:
          - {label: "Alto", name: "alto", widget: "number", value_type: "float", min: 0.1}
          - {label: "Ancho", name: "ancho", widget: "number", value_type: "float", min: 0.1}
          - {label: "Profundidad", name: "profundidad", widget: "number", value_type: "float", min: 0.1}
          - {label: "Unidad", name: "unidad", widget: "string", default: "cm"}
          - {label: "Personalizable", name: "personalizable", widget: "boolean", default: true, hint: "¿Se pueden cambiar estas medidas a pedido?"}
      - {label: "Material", name: "material", widget: "string", hint: "Material principal (ej. Madera sólida de raulí)"}
      - {label: "Tiempo Fabricación", name: "tiempo_fabricacion_estimado", widget: "string", hint: "Ejemplo: '3 a 4 semanas'"}
      - {label: "Precio Referencial", name: "precio_referencial", widget: "number", value_type: "int", min: 0, hint: "Ingresa el precio en CLP sin puntos ni símbolo (ej. 150000)"}
      - {label: "Nota de Precio", name: "precio_nota", widget: "string", default: "Precio referencial. Medidas y materiales personalizables — precio final se coordina por WhatsApp", hint: "Aclaración sobre el precio."}
      - {label: "Destacado", name: "destacado", widget: "boolean", default: false, hint: "Márcalo para que aparezca en la sección principal del Home"}

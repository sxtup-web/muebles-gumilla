<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin - Muebles Gumilla</title>
</head>
<body>
  <!-- Incluir la app de Decap CMS -->
  <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
  <!-- Incluir la traducción al español -->
  <script src="https://unpkg.com/decap-cms-locales@3.8.0/dist/decap-cms-locales-es.js"></script>
  <script>
    CMS.registerLocale('es', decapCmsLocalesEs);
    CMS.registerPreviewStyle('https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css');
    
    var ProductPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var data = entry.getIn(['data']).toJS();
        
        if (!data.nombre) return h('div', {className: "p-8 text-gray-500 font-sans"}, "Ingresa un nombre para ver la previsualización...");
        
        var formatPrice = (price) => {
          if (!price) return '';
          return new Intl.NumberFormat('es-CL', {
            style: 'currency', currency: 'CLP', maximumFractionDigits: 0,
          }).format(price);
        };
        
        var imageSrc = '';
        if (data.imagenes && data.imagenes.length > 0 && data.imagenes[0].imagen) {
          imageSrc = this.props.getAsset(data.imagenes[0].imagen).toString();
        }
        
        return h('div', {className: "max-w-5xl mx-auto p-4 sm:p-8 bg-gray-50 font-sans text-gray-900"},
          h('div', {className: "bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-10"},
            h('div', {className: "grid grid-cols-1 lg:grid-cols-2 gap-12"},
              h('div', {className: "flex flex-col gap-6"},
                h('div', {className: "bg-white p-4 sm:p-5 rounded-2xl border-2 border-white shadow-md"},
                  h('div', {className: "aspect-w-4 aspect-h-5 relative overflow-hidden bg-gray-100 rounded-lg", style: {paddingBottom: '125%'}},
                    imageSrc ? h('img', {src: imageSrc, className: "absolute inset-0 w-full h-full object-cover"}) : h('div', {className: "absolute inset-0 flex items-center justify-center text-gray-400"}, "Sin imagen")
                  )
                )
              ),
              h('div', {className: "flex flex-col"},
                h('span', {className: "text-sm font-semibold tracking-widest text-yellow-800 uppercase mb-3"}, data.categoria || 'Categoría'),
                h('h1', {className: "text-3xl md:text-5xl font-serif text-gray-900 mb-4"}, data.nombre),
                h('p', {className: "text-gray-600 text-lg leading-relaxed mb-8"}, data.descripcion_corta),
                h('div', {className: "flex items-baseline gap-4 mb-6"},
                  h('span', {className: "text-3xl font-medium tracking-tight text-gray-900"}, formatPrice(data.precio_referencial))
                ),
                h('p', {className: "text-sm text-gray-500 mb-10"}, data.precio_nota),
                h('div', {className: "bg-gray-50 p-6 rounded-xl border border-gray-200 mb-10"},
                  h('h3', {className: "text-xl font-serif mb-4 text-gray-900"}, "Especificaciones Técnicas"),
                  h('dl', {className: "space-y-4 text-sm"},
                    h('div', {className: "flex justify-between pb-3 border-b border-gray-200"},
                      h('dt', {className: "text-gray-500"}, "Material"),
                      h('dd', {className: "font-medium text-gray-900 text-right"}, data.material)
                    ),
                    h('div', {className: "flex justify-between pb-3 border-b border-gray-200"},
                      h('dt', {className: "text-gray-500"}, "Dimensiones (" + (data.medidas?.unidad || 'cm') + ")"),
                      h('dd', {className: "font-medium text-gray-900 text-right"}, 
                        (data.medidas?.alto || '-') + " alto × " + (data.medidas?.ancho || '-') + " ancho × " + (data.medidas?.profundidad || '-') + " prof."
                      )
                    ),
                    h('div', {className: "flex justify-between pb-3 border-b border-gray-200"},
                      h('dt', {className: "text-gray-500"}, "Tiempo de fabricación"),
                      h('dd', {className: "font-medium text-gray-900 text-right"}, data.tiempo_fabricacion_estimado)
                    )
                  )
                ),
                h('div', {className: "prose prose-sm max-w-none text-gray-600"}, 
                  this.props.widgetFor('descripcion_larga')
                )
              )
            )
          )
        );
      }
    });
    
    CMS.registerPreviewTemplate('productos', ProductPreview);
  </script>
</body>
</html>
